name: Build Android viewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-viewer/**"
      - ".github/workflows/android-viewer.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android-viewer/*.gradle.kts
            android-viewer/app/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build APK
        working-directory: android-viewer
        shell: bash
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK attachment
        shell: bash
        run: |
          mkdir -p dist/android
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android-viewer/app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          cp android-viewer/app/build/outputs/apk/debug/app-debug.apk "dist/android/LaTeX.Android.$VERSION-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaTeX-Project-Viewer-Android
          path: dist/android/*.apk
          if-no-files-found: error
