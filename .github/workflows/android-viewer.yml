name: Build Android viewer

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build the installed stable app or the parallel-install Beta app
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
  push:
    branches:
      - main
      - "beta/**"
    paths:
      - "android-viewer/**"
      - ".github/workflows/android-viewer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}

      - id: release_channel
        name: Select release channel
        shell: bash
        run: |
          CHANNEL="${{ inputs.channel }}"
          if [[ -z "$CHANNEL" ]]; then
            if [[ "$GITHUB_REF_NAME" == "main" ]]; then CHANNEL=stable; else CHANNEL=beta; fi
          fi
          if [[ "$CHANNEL" != "stable" && "$CHANNEL" != "beta" ]]; then exit 1; fi
          echo "BUILD_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          if [[ "$CHANNEL" == "beta" ]]; then echo "ANDROID_VARIANT=Beta" >> "$GITHUB_ENV"; else echo "ANDROID_VARIANT=Stable" >> "$GITHUB_ENV"; fi

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android-viewer/*.gradle.kts
            android-viewer/app/*.gradle.kts

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: android-viewer
        shell: bash
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.ANDROID_GITHUB_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon "test${ANDROID_VARIANT}DebugUnitTest"
          ./gradlew --no-daemon "assemble${ANDROID_VARIANT}Debug"

      - name: Prepare APK attachment
        shell: bash
        run: |
          mkdir -p dist/android
          FLAVOR="${BUILD_CHANNEL}"
          APK="android-viewer/app/build/outputs/apk/${FLAVOR}/debug/app-${FLAVOR}-debug.apk"
          if [[ "$BUILD_CHANNEL" == "beta" ]]; then
            VERSION="$(node -p "require('./package.json').config.betaVersion")"
            LABEL=Beta
          else
            VERSION="$(node -p "require('./package.json').version")"
            LABEL=Stable
          fi
          test -n "$VERSION"
          test -f "$APK"
          cp "$APK" "dist/android/LaTeX.Android.$LABEL.$VERSION-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LaTeX-Project-Viewer-Android-${{ steps.release_channel.outputs.channel }}
          path: dist/android/*.apk
          if-no-files-found: error
