name: Build Windows client

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Build the installed stable app or the parallel-install Beta app
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - id: release_channel
        name: Select release channel
        shell: pwsh
        run: |
          $channel = '${{ inputs.channel }}'
          if ($channel -notin @('stable', 'beta')) { throw 'Unknown release channel.' }
          "BUILD_CHANNEL=$channel" >> $env:GITHUB_ENV
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Use canonical runner temp directory
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm run typecheck
          pnpm test

      - name: Build Windows installer and portable client
        shell: pwsh
        run: |
          pnpm build
          if ($env:BUILD_CHANNEL -eq 'beta') {
            pnpm exec electron-builder --config electron-builder.beta.cjs --win nsis portable --publish never
          } else {
            pnpm exec electron-builder --win nsis portable --publish never
          }

      - name: Stage channel-specific assets
        shell: pwsh
        run: |
          $source = if ($env:BUILD_CHANNEL -eq 'beta') { 'dist-beta' } else { 'dist' }
          $version = if ($env:BUILD_CHANNEL -eq 'beta') {
            (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).config.betaVersion
          } else {
            (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          }
          $destination = "dist-channel/$env:BUILD_CHANNEL"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem -LiteralPath $source -Filter '*.exe' | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $destination
          }
          if (-not (Get-ChildItem -LiteralPath $destination -Filter '*.exe')) { throw 'Windows assets were not produced.' }
          Set-Content -LiteralPath "$destination/version.txt" -Value $version -NoNewline -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaTeX-Project-Manager-Windows-${{ steps.release_channel.outputs.channel }}
          path: dist-channel/${{ steps.release_channel.outputs.channel }}/*
          if-no-files-found: error
