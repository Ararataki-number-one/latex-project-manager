name: Build Windows client

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Use canonical runner temp directory
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm run typecheck
          pnpm test

      - name: Build Windows installer and portable client
        run: |
          pnpm build
          pnpm exec electron-builder --win nsis portable --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaTeX-Project-Manager-Windows
          path: dist/*.exe
          if-no-files-found: error
