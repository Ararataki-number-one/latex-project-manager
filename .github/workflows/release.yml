name: Release v0.11 desktop and Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify release versions agree
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          ANDROID_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android-viewer/app/build.gradle.kts | head -n 1)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_VERSION="$PACKAGE_VERSION"
          fi
          test -n "$PACKAGE_VERSION"
          test "$PACKAGE_VERSION" = "$ANDROID_VERSION"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder --win nsis portable --publish never
      - name: Record Windows publisher certificate when present
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath dist -Filter '*.exe' | Where-Object { $_.Name -match 'setup' } | Select-Object -First 1
          if (-not $setup) { throw 'Windows setup asset was not produced.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          $digest = ''
          if ($signature.Status -eq 'Valid' -and $signature.SignerCertificate) {
            $hasher = [Security.Cryptography.SHA256]::Create()
            try { $digest = ([BitConverter]::ToString($hasher.ComputeHash($signature.SignerCertificate.RawData))).Replace('-', '').ToLowerInvariant() }
            finally { $hasher.Dispose() }
          }
          Set-Content -LiteralPath dist/windows-certificate-sha256.txt -Value $digest -NoNewline -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.exe
            dist/windows-certificate-sha256.txt
          if-no-files-found: error

  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android-viewer/*.gradle.kts
            android-viewer/app/*.gradle.kts
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore fixed Android signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/latex-viewer.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/latex-viewer.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Test and build signed APK
        working-directory: android-viewer
        shell: bash
        env:
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.ANDROID_GITHUB_CLIENT_ID }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test -n "$GITHUB_OAUTH_CLIENT_ID"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest
          ./gradlew --no-daemon assembleRelease
      - name: Verify APK and prepare attachment
        shell: bash
        run: |
          APK=android-viewer/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android-viewer/app/build.gradle.kts | head -n 1)"
          DIGEST="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr -d ':[:space:]')"
          test -n "$VERSION"
          test "${#DIGEST}" -eq 64
          mkdir -p dist/android
          cp "$APK" "dist/android/LaTeX.Android.$VERSION.apk"
          printf '%s\n' "$DIGEST" > dist/android/android-certificate-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/android/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-assets/android
      - name: Restore release-manifest signing key
        shell: bash
        env:
          RELEASE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_MANIFEST_PRIVATE_KEY_BASE64 }}
        run: |
          test -n "$RELEASE_MANIFEST_PRIVATE_KEY_BASE64"
          printf '%s' "$RELEASE_MANIFEST_PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-manifest-private.pem"
          chmod 600 "$RUNNER_TEMP/release-manifest-private.pem"
      - name: Sign immutable release manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP="$(find release-assets/windows -maxdepth 1 -type f -iname '*setup*.exe' -print -quit)"
          PORTABLE="$(find release-assets/windows -maxdepth 1 -type f -iname '*.exe' ! -iname '*setup*' -print -quit)"
          APK="$(find release-assets/android -maxdepth 1 -type f -iname '*.apk' -print -quit)"
          test -f "$SETUP"
          test -f "$PORTABLE"
          test -f "$APK"
          export ANDROID_CERTIFICATE_SHA256="$(tr -d ':[:space:]' < release-assets/android/android-certificate-sha256.txt)"
          export WINDOWS_CERTIFICATE_SHA256="$(tr -d ':[:space:]' < release-assets/windows/windows-certificate-sha256.txt)"
          node scripts/sign-release-manifest.mjs \
            --version "$VERSION" \
            --tag "$GITHUB_REF_NAME" \
            --private-key "$RUNNER_TEMP/release-manifest-private.pem" \
            --output release-assets/release-manifest.json \
            --asset "windows-setup=$SETUP" \
            --asset "windows-portable=$PORTABLE" \
            --asset "android-apk=$APK"
      - name: Publish verified assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*.exe
            release-assets/android/*.apk
            release-assets/release-manifest.json
            release-assets/release-checksums.sha256
            release-manifest-public.pem
